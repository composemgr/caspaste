name: caspaste
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/casjay-forks/caspaste:latest
    container_name: caspaste-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      TZ: ${TZ:-America/New_York}
      CASPASTE_DB_CLEANUP_PERIOD: 1m
      CASPASTE_ROBOTS_DISALLOW: false
      CASPASTE_TITLE_TITLE_MAX_LENGTH: 120
      CASPASTE_BODY_MAX_LENGTH: 9999999999999999
      CASPASTE_MAX_PASTE_LIFETIME: unlimited
      CASPASTE_ADMIN_NAME: ${APP_ORG_NAME:-CasPaste}
      CASPASTE_ADDRESS: ${BASE_HOST_NAME:-$HOSTNAME}
      CASPASTE_UI_DEFAULT_LIFETIME: never
      CASPASTE_UI_DEFAULT_THEME: dark
      CASPASTE_GET_PASTES_PER_5MIN: 0
      CASPASTE_GET_PASTES_PER_15MIN: 0
      CASPASTE_GET_PASTES_PER_1HOUR: 0
      CASPASTE_NEW_PASTES_PER_5MIN: 30
      CASPASTE_NEW_PASTES_PER_15MIN: 60
      CASPASTE_NEW_PASTES_PER_1HOUR: 120
      CASPASTE_DB_DRIVER: postgres
      CASPASTE_DB_SOURCE: postgres://${DB_USER_NAME:-caspaste}:${DB_USER_PASS:-replace-with-a-random-password}@caspaste-db/${DB_CREATE_DATABASE_NAME:-caspaste}?sslmode=disable
      CONTAINER_NAME: caspaste-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data:/data'
      - './volumes/config:/config'
    depends_on:
      db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.caspaste-app.entrypoints=http'
      - 'traefik.http.routers.caspaste-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`'
      - 'traefik.http.routers.caspaste-app.middlewares=caspaste-app-https-redirect'
      - 'traefik.http.middlewares.caspaste-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.caspaste-app-secure.entrypoints=https'
      - 'traefik.http.routers.caspaste-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`'
      - 'traefik.http.routers.caspaste-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.caspaste-app-secure.service=caspaste-app'
      - 'traefik.http.services.caspaste-app.loadbalancer.server.port=80'
    networks:
      - caspaste
      - traefik

  db:
    image: postgres:latest
    container_name: caspaste-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: caspaste-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-caspaste}
      POSTGRES_USER: ${DB_USER_NAME:-caspaste}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      CONTAINER_NAME: caspaste-db
    volumes:
      - './volumes/data/db/postgres/caspaste:/var/lib/postgresql/data:z'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - caspaste

networks:
  caspaste:
    name: caspaste
    external: false
  traefik:
    external: true
